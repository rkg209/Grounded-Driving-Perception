# Default config — runs on the M4 laptop against the synthetic fixture, with zero downloads.
# Override with a second -c file (merged left-to-right), e.g.:
#   uv run gdp info -c configs/default.yaml -c configs/bdd100k.yaml

seed: 42
device: auto # auto → cuda (cluster) → mps (M4) → cpu

paths:
  data_root: data
  runs_root: runs

dataset:
  name: mini_bdd
  root: tests/fixtures/mini_bdd
  annotations: tests/fixtures/mini_bdd/annotations.json
  classes:
    - pedestrian
    - rider
    - car
    - truck
    - bus
    - train
    - motorcycle
    - bicycle
    - traffic light
    - traffic sign

detector: # Stage 1
  model_id: IDEA-Research/grounding-dino-tiny
  box_threshold: 0.25
  text_threshold: 0.25
  # Must be true to export ONNX (custom MS-deform-attn kernels are not exportable). Spec 05.
  disable_custom_kernels: false
  # `gdp evaluate --sweep` picks from these, on train only — never val (leakage, H8).
  sweep_candidates: [0.15, 0.2, 0.25, 0.3, 0.35, 0.4]

vlm: # Stage 2 — a SEPARATE model from the detector (H6)
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  max_new_tokens: 128
  lora_r: 16
  lora_alpha: 32
  num_views: 1 # CAM_FRONT only; all six views still stored per-record
  max_pixels: null # processor default

grounding: # Spec 04 — self-built grounding eval set, the sanctioned H9 exception
  iou_threshold: 0.5
  num_frames: 60
  min_phrases: 150
  qualifier_types: [spatial, attribute, relational, negative]
  phrases_path: data/grounding_eval/phrases.json
  overlays_dir: data/grounding_eval/overlays

vlm_training: # Spec 07 — LoRA fine-tune tunables for the VLM (default.yaml). A separate model from `training:` (H6).
  lr: 1.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03
  epochs: 2
  batch_size: 1
  grad_accum: 8 # 3B model at batch_size=1 needs accumulation; spec 03's detector trainer refuses this, spec 07 implements it
  max_grad_norm: 1.0
  lora_dropout: 0.05
  gradient_checkpointing: true
  # Overfit-16 gate: must be true (final loss < overfit_loss_target) before the real run is allowed to start.
  overfit_qa_pairs: 16
  overfit_max_steps: 200
  overfit_loss_target: 0.05
  save_every: 200
  log_every: 10
  max_seq_len: 4096

drivelm: # Spec 06 — Stage-2 data, official nuScenes scene split. Points at the fixture by default.
  annotations: tests/fixtures/mini_drivelm/v1_1_mini_nus.json
  nuscenes_root: tests/fixtures/mini_drivelm
  scene_meta: tests/fixtures/mini_drivelm/scene.json
  out_dir: data/drivelm
  train_scene_fraction: 1.0
  subsample_seed: 42
  categories: [perception, prediction, planning, behavior]

vqa_eval: # Spec 08 — base-vs-fine-tuned VQA eval. Decoding pinned here so both runs are comparable (H8).
  max_new_tokens: 128
  do_sample: false # greedy — a sampled base run vs. a greedy fine-tuned run is not a comparison
  num_beams: 1
  batch_size: 1 # left-padded batching is a later optimisation, not a v1 risk
  failure_sample_size: 40 # >= 30 per spec 08 acceptance criterion 4
