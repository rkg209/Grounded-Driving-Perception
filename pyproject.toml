[project]
name = "gdp"
version = "0.1.0"
description = "Grounded Driving Perception — open-vocabulary detection + driving-scene VQA, edge-benchmarked"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pycocotools>=2.0.7",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
    "torch>=2.4",
    "transformers>=4.44",
    "typer>=0.12",
]

[project.scripts]
gdp = "gdp.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
