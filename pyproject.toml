[project]
name = "gdp"
version = "0.1.0"
description = "Grounded Driving Perception — open-vocabulary detection + driving-scene VQA, edge-benchmarked"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.34",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "onnxscript>=0.1",
    "peft>=0.13",
    "pillow>=10.0",
    "pycocotools>=2.0.7",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.49",
    "typer>=0.12",
]

[project.scripts]
gdp = "gdp.cli:app"

[project.optional-dependencies]
# Deps for the vendored DriveLM challenge scorer (third_party/drivelm/evaluation.py), spec 08.
# `language_evaluation` isn't on PyPI — install per its own README:
#   uv pip install "git+https://github.com/bckim92/language-evaluation.git"
#   uv run python -c "import language_evaluation; language_evaluation.download('coco')"
# `openai` is required only to *import* gpt_eval.GPTEvaluation (the vendored evaluation_suit
# constructs it unconditionally); this repo never calls it — see third_party/drivelm/PROVENANCE.md.
drivelm-eval = [
    "openai>=1.0",
]
# Spec 09 — the integrated Gradio demo. Optional: `gdp --help` and the rest of the CLI must import
# and run with zero download even when this group isn't installed (build_app imports gradio
# lazily, inside the function, not at module import time).
demo = [
    "gradio>=4.44",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# third_party/ is vendored code (e.g. the DriveLM challenge scorer, spec 08) — never edited, so
# never linted or reformatted by us. See third_party/drivelm/PROVENANCE.md.
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not model_heavy'"
markers = [
    "model_heavy: loads a real HF model (grounding-dino-tiny or larger) — deselected by default; run with `-m model_heavy` or `-m ''`",
]
